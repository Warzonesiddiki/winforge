name: Bug report
description: Report a problem with WinForge (Go engine or web control center)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. **Do not report security vulnerabilities here** —
        see [SECURITY.md](../blob/main/SECURITY.md) for private disclosure instructions.
  - type: input
    id: version
    attributes:
      label: WinForge version
      description: Output of `winforge.exe version` (or the commit SHA if built from source).
      placeholder: "0.1.0-dev / abc1234"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Go engine (winforge.exe)
        - Web control center (Next.js)
        - Embedded dashboard (web/app.js)
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "e.g. Windows 11 24H2, Windows 10 22H2"
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: elevated
    attributes:
      label: Was WinForge running elevated?
      options:
        - "Yes (Administrator)"
        - "No (standard user)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command or UI action that triggered the problem.
      value: |
        1.
        2.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Paste the error and any relevant lines from
        `%LOCALAPPDATA%\WinForge\logs\operations-YYYY-MM-DD.jsonl`.
        This will be automatically formatted as code.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I am running the latest release (or built from the latest `main`)
          required: true
