name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # WinForge is intentionally stdlib-only, so the module cache is never needed
  # and the build must succeed with no network access to a module proxy.
  GOFLAGS: -mod=mod
  GOPROXY: off

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...

  windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      # Building and vetting on a real Windows runner is what catches the
      # GOOS=windows-only code that never compiles during Linux-only checks.
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: 386
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go build
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: go vet
        run: go vet ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  syntax:
    name: JSON and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            node --check "$file" || status=1
          done < <(find web -name '*.js' -print0)
          exit $status
      - name: Check JSON syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$file" \
              || { echo "::error file=$file::invalid JSON"; status=1; }
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          exit $status
      - name: Check for whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
