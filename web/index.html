<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WinForge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">WF</div>
        <div>
          <div class="brand-name">WinForge</div>
          <div class="brand-sub">System Toolkit</div>
        </div>
      </div>
      <nav>
        <a href="#" data-view="dashboard" class="active">Dashboard</a>
        <a href="#" data-view="tweaks">Tweaks</a>
        <a href="#" data-view="apps">Apps</a>
        <a href="#" data-view="history">History</a>
      </nav>
      <div class="sidebar-foot">
        <div id="elevation" class="pill">checking…</div>
        <div class="version" id="version">v—</div>
      </div>
    </aside>

    <main class="content">
      <section id="view-dashboard" class="view active">
        <h1>Dashboard</h1>
        <div class="cards">
          <div class="card health-card">
            <div class="label">Health Score</div>
            <div class="score" id="health-score">—</div>
            <div class="meter"><div id="health-meter" class="meter-fill"></div></div>
          </div>
          <div class="card">
            <div class="label">Tweaks Applied</div>
            <div class="score small" id="tweaks-applied">—</div>
          </div>
          <div class="card">
            <div class="label">OS</div>
            <div class="score small" id="os-name">—</div>
          </div>
        </div>
        <h2>Breakdown</h2>
        <div class="card breakdown" id="health-breakdown"></div>
      </section>

      <section id="view-tweaks" class="view">
        <h1>Tweaks</h1>
        <p class="muted">Toggle a tweak to apply or undo it. Changes are logged and reversible where noted.</p>
        <div id="tweaks-list"></div>
      </section>

      <section id="view-apps" class="view">
        <h1>Apps</h1>
        <div class="toolbar">
          <input id="app-search" type="search" placeholder="Search apps…" />
          <button id="app-install-selected" class="primary" disabled>Install Selected</button>
        </div>
        <div id="app-categories" class="chips"></div>
        <div id="apps-list" class="apps-grid"></div>
        <div id="install-log" class="log hidden"></div>
      </section>

      <section id="view-history" class="view">
        <h1>History</h1>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr><th>Time</th><th>Operation</th><th>Target</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
